spring.application.name=shop
spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
payments.razorpay.url=https://api.razorpay.example/v1/charges
spring.config.import=optional:file:.env[.properties]
# REVIEW [Blocker] (added) A live API key was committed here: anyone with repo access could charge cards,
#   and the key stays in git history forever -> read it from the environment, and ROTATE the leaked key
payments.razorpay.api-key=${RAZORPAY_API_KEY:}
